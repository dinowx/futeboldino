function rbox(){const k=S.rk,t=tier(k.pts),pc=t.hi?Math.round((k.pts-t.lo)/(t.hi-t.lo)*100):100;return `<span class="tag" style="background:${TC[t.i]}">${t.n}</span> <b>${k.pts}</b> pts${t.hi?` · faltam ${t.hi-k.pts} para ${TI[t.i+1][0]}`:" · rank máximo!"}<div class="bar" style="margin-top:6px"><i style="width:${pc}%"></i></div>`}
function rank(){
 const k=S.rk,pa=k.ans?Math.round(k.corr/k.ans*100):0;
 let h=`<div class="hero"><h1>🏅 Ranking</h1><span>Seu nível como treinador</span></div><div class="card">${rbox()}</div><div class="card"><h2>Estatísticas</h2><div class="grid">${[["Títulos",k.titles],["Jogos disputados",k.played],["Vitórias",k.wins],["Aproveitamento no quiz",pa+"%"],["Melhor sequência",k.best]].map(x=>`<div class="pl"><span class="mu">${x[0]}</span><b style="font-size:1.4rem">${x[1]}</b></div>`).join("")}</div></div>`;
 h+=`<div class="card"><h2>Melhores campanhas</h2>${k.hist.length?k.hist.map((c,i)=>`<p style="display:flex;gap:8px;align-items:center;margin:6px 0">${["🥇","🥈","🥉","4º","5º"][i]} ${dot(c.t)}<b>${T[c.t][0]}</b><span class="mu" style="flex:1">${c.f} · ${c.d}</span><b>${c.p} pts</b></p>`).join(""):'<p class="mu">Termine uma campanha para entrar no ranking.</p>'}</div>`;
 h+=`<div class="card"><h2>Escada de ranks</h2>${TI.map((t,i)=>`<p style="margin:6px 0"><span class="tag" style="background:${TC[i]}">${t[0]}</span> a partir de ${t[1]} pts</p>`).join("")}<p class="mu">Pontos: acerto 2, 3, 5 ou 8 conforme o nível · vitória 20 + 10 por fase · título +100 · eliminação 5 por fase alcançada.</p></div><button class="pri" onclick="menu()">Voltar</button>`;
 app.innerHTML=h;
}
function nq(){const lv=Math.min(G.r,3);if(!pools[lv].length)pools[lv]=sh(L[lv].slice());const q=pools[lv].pop();return{q:q[0],c:q[1],o:sh(q.slice(1)),lv}}

function menu(){
 clearInterval(tm);
 app.innerHTML=`<div class="hero"><h1>⚽ Copa do Brasil Quiz</h1><span>Mata-mata · futebol brasileiro e mundial</span></div><p class="mu">Mata-mata com 16 times. Nos lances de ataque e defesa surge uma pergunta sobre futebol brasileiro e mundial: acertar decide o lance. Empate vai para os pênaltis. A cada fase as perguntas ficam mais difíceis e o tempo para responder diminui (15s, 15s, 12s e 10s na final).</p><div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>🪙 <b>${S.tokens}</b> tokens · Ataque +${bon("A")} · Defesa +${bon("D")}</span><button class="pri" onclick="shop()">Elenco e loja</button></div><div class="card">${rbox()}<button style="margin-top:8px" onclick="rank()">🏅 Ver ranking</button></div><div class="card"><h2>Escolha seu time</h2><div class="grid">${T.map((t,i)=>`<button class="t" style="border-left:6px solid ${T[i][1]}" onclick="start(${i})">${dot(i)}${t[0]}</button>`).join("")}</div></div>`;
}
function start(me){
 const ids=sh(T.map((_,i)=>i));
 G={me,r:0,rounds:[ids],res:[],over:false,pts:0};
 bracket();
}
function bHTML(){
 let h='<div class="tree">';
 for(let ri=0;ri<4;ri++){
  const rd=G.rounds[ri],n=8>>ri,ms=[];
  h+=`<div class="col"><b class="rt${ri==G.r&&!G.over?" cur":""}">${RN[ri]}</b>`;
  for(let k=0;k<n;k++){
   const a=rd?rd[2*k]:null,b=rd?rd[2*k+1]:null,w=G.res[ri]&&G.res[ri][k];
   const row=t=>t==null?`<div class="tr"><span class="dot"></span><span class="mu">A definir</span></div>`:`<div class="tr${t==G.me?" me":""}${w===t?" win":""}">${dot(t)}<span>${T[t][0]}</span>${w===t?"✓":""}</div>`;
   ms.push(`<div class="mt">${row(a)}${row(b)}</div>`);
  }
  if(ri<3){let p="";for(let k=0;k<n;k+=2)p+=`<div class="pr">${ms[k]}${ms[k+1]}</div>`;h+=`<div class="cc">${p}</div>`}
  else h+=`<div class="cc"><div class="pr one">${ms[0]}</div></div>`;
  h+="</div>";
 }
 const ch=G.res[3]&&G.res[3][0];
 return h+`<div class="col"><b class="rt">Campeão</b><div class="cc"><div class="pr one"><div class="champ">${ch!=null?`${dot(ch)}<br>${T[ch][0]}`:""}<div style="font-size:2.2rem">🏆</div></div></div></div></div></div>`;
}
function showTree(){G.over=true;app.innerHTML=`<div class="hero"><h1>Chaveamento final</h1><span>Copa do Brasil</span></div><div class="card">${bHTML()}</div><button class="pri" onclick="menu()">Jogar de novo</button>`}
function bracket(){
 const cur=G.rounds[G.r],pairs=[];
 for(let i=0;i<cur.length;i+=2)pairs.push([cur[i],cur[i+1]]);
 G.pairs=pairs;const mine=pairs.find(p=>p.includes(G.me));G.mine=mine;
 app.innerHTML=`<div class="hero"><h1>${RN[G.r]}</h1><span>Copa do Brasil · você joga como ${T[G.me][0]}</span></div><div class="card">${bHTML()}</div><div class="card" style="text-align:center"><h2>Seu próximo jogo</h2><div class="vsr"><b>${dot(mine[0])}${T[mine[0]][0]}</b><i>x</i><b>${T[mine[1]][0]}${dot(mine[1])}</b></div><p class="mu">🪙 ${S.tokens} tokens · Ataque +${bon("A")} · Defesa +${bon("D")}</p><button class="pri" onclick="kick()">Começar a partida</button> <button onclick="shop(1)">🪙 Elenco e loja</button> <button onclick="menu()">Sair</button></div>`;
}
function bracketOld(){
 const cur=G.rounds[G.r],pairs=[];
 for(let i=0;i<cur.length;i+=2)pairs.push([cur[i],cur[i+1]]);
 G.pairs=pairs;
 const mine=pairs.find(p=>p.includes(G.me));
 const cols=G.rounds.map((rd,ri)=>{
  let h=`<div><b>${RN[ri]}</b>`;
  for(let i=0;i<rd.length;i+=2){const w=G.res[ri]&&G.res[ri][i/2];
   h+=[rd[i],rd[i+1]].map(t=>`<p class="${t==G.me?"me ":""}${w===t?"win":""}">${dot(t)} ${T[t][0]}</p>`).join("")+`<div style="height:6px"></div>`}
  return h+"</div>"}).join("");
 app.innerHTML=`<h1>${RN[G.r]}</h1><div class="card br">${cols}</div><div class="card"><h2>Seu jogo</h2><p>${dot(mine[0])}<b>${T[mine[0]][0]}</b> x <b>${T[mine[1]][0]}</b>${dot(mine[1])}</p><button class="pri" onclick="kick()">Começar a partida</button> <button onclick="menu()">Sair</button></div>`;
 G.mine=mine;
}
function kick(){
 const opp=G.mine[0]==G.me?G.mine[1]:G.mine[0];
 const mins=sh([4,9,15,22,29,36,43,51,58,65,72,79,86]).slice(0,8).sort((a,b)=>a-b);
 M={opp,a:0,b:0,i:0,mins,log:[],streak:0};G.earn=0;
 draw();setTimeout(moment,600);
}
function draw(extra){
 const m=M;
 app.innerHTML=`<div class="card"><div class="sb"><span>${dot(G.me)}${T[G.me][0]}</span><span class="sc">${m.a} x ${m.b}</span><span>${T[m.opp][0]}${dot(m.opp)}</span></div><p class="mu" style="margin:4px 0">🪙 ${S.tokens} · ${RN[G.r]} · <span id="min">${m.cur||0}'</span></p><div class="pitch"><span class="ball" id="ball" style="left:50%">⚽</span></div><div id="box"></div></div><div class="card log" id="log">${m.log.join("<br>")}</div>`;
}
function say(t){M.log.unshift(t);$("log").innerHTML=M.log.join("<br>")}
function ask(title,color,cb){
 const q=nq(),tot=[15,15,12,10][G.r];let t=tot,done=false;
 $("box").innerHTML=`<span class="tag" style="background:${color}">${title}</span> <span class="tag" style="background:var(--mu)">${["Fácil","Médio","Difícil","Expert"][q.lv]} · ${tot}s</span><div class="q">${q.q}</div><div class="bar"><i id="tb"></i></div><div class="opts" style="margin-top:10px">${q.o.map((o,i)=>`<button data-i="${i}">${o}</button>`).join("")}</div>`;
 const bs=[...$("box").querySelectorAll("button")];
 const fin=(ok,btn)=>{if(done)return;done=true;clearInterval(tm);S.rk.ans++;if(ok)reward(q.lv);else M.streak=0;
  bs.forEach(b=>{b.disabled=true;if(b.textContent==q.c)b.classList.add("ok")});
  if(btn&&!ok)btn.classList.add("no");
  setTimeout(()=>cb(ok),1100)};
 bs.forEach(b=>b.onclick=()=>fin(b.textContent==q.c,b));
 tm=setInterval(()=>{t-=.1;$("tb").style.width=(t/tot*100)+"%";if(t<=0)fin(false)},100);
}
function moment(){
 if(M.i>=M.mins.length)return endReg();
 const m=M,min=m.mins[m.i++];m.cur=min;$("min").textContent=min+"'";
 const att=R()<.5,pen=.03*G.r;
 $("ball").style.left=att?"80%":"20%";
 if(att&&R()<.4)return freeKick(min);
 if(att){
  ask("⚔️ ATAQUE! Responda para finalizar","#12803f",ok=>{
   if(R()<Math.min(.95,(ok?.75:.1)+bon("A")*.02)){m.a++;say(`${min}' ⚽ GOL do ${T[G.me][0]}!`)}
   else say(`${min}' ${ok?"Chute defendido pelo goleiro.":"Lance perdido, a bola foi para fora."}`);
   draw2();});
 }else{
  ask("🛡️ DEFESA! Responda para evitar o gol","#c0392b",ok=>{
   if(R()<Math.max(.02,(ok?.1+pen:.7+pen)-bon("D")*.02)){m.b++;say(`${min}' 😬 Gol do ${T[m.opp][0]}.`)}
   else say(`${min}' ${ok?"Grande desarme, perigo afastado!":"Susto, mas a bola saiu."}`);
   draw2();});
 }
}
const VQ=[
["O Brasil é pentacampeão mundial de futebol.",true,0],["Pelé jogou toda a carreira profissional no Flamengo.",false,0],["A Copa do Mundo de 2014 foi disputada no Brasil.",true,0],["Um time de futebol joga com 12 jogadores em campo.",false,0],["O Maracanã fica na cidade de São Paulo.",false,0],
["Neymar é o maior artilheiro da história da Seleção Brasileira.",true,1],["A Alemanha venceu o Brasil por 7 a 1 na semifinal de 2014.",true,1],["O Corinthians foi campeão da Libertadores de 2012.",true,1],["Ronaldo foi o artilheiro da Copa de 2002.",true,1],["O Brasil venceu a Copa do Mundo de 2018.",false,1],
["O Grêmio foi o primeiro campeão da Copa do Brasil.",true,2],["A Libertadores de 1960 foi vencida pelo Santos.",false,2],["Pelé marcou 12 gols em Copas do Mundo.",true,2],["O Cruzeiro é o maior campeão da Copa do Brasil.",true,2],["O Vasco foi campeão da Copa do Brasil de 2011.",true,2],
["Hakan Şükür fez o gol mais rápido da história das Copas.",true,3],["A Copa do Mundo de 1950 foi vencida pelo Brasil.",false,3],["Messi é o jogador com mais partidas em Copas do Mundo.",true,3],["O Palmeiras venceu a Libertadores de 1999 nos pênaltis.",true,3],["O Cruzeiro foi campeão da Libertadores em 1976 e em 1997.",true,3]];
function scene(cob){
 const mc=T[G.me][1],oc=T[M.opp][1];
 const man=(x,c)=>`<g transform="translate(${x},190)"><circle cx="0" cy="-52" r="8" fill="#f1c9a5"/><rect x="-9" y="-44" width="18" height="30" rx="5" fill="${c}"/><rect x="-8" y="-14" width="6" height="14" fill="#222"/><rect x="2" y="-14" width="6" height="14" fill="#222"/></g>`;
 return `<svg viewBox="0 0 640 230" style="width:100%;display:block;border-radius:10px;margin:8px 0"><defs><pattern id="net" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 0H10M0 0V10" stroke="#ffffff66" stroke-width="1"/></pattern></defs><rect width="640" height="230" fill="#2e8b4a"/><rect width="640" height="70" fill="#1d5c32"/><rect y="196" width="640" height="34" fill="#379953"/><rect x="520" y="80" width="100" height="110" fill="url(#net)" stroke="#fff" stroke-width="4"/><text x="130" y="112" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">${cob}</text><g id="gk" transform="translate(572,190)"><circle cx="0" cy="-52" r="8" fill="#f1c9a5"/><rect x="-10" y="-44" width="20" height="30" rx="5" fill="#f1c40f"/><rect x="-22" y="-42" width="12" height="6" fill="#f1c40f"/><rect x="10" y="-42" width="12" height="6" fill="#f1c40f"/><rect x="-8" y="-14" width="6" height="14" fill="#222"/><rect x="2" y="-14" width="6" height="14" fill="#222"/></g>${[330,350,370,390].map(x=>man(x,oc)).join("")}<g id="kick" transform="translate(120,190)"><circle cx="0" cy="-52" r="8" fill="#f1c9a5"/><rect x="-10" y="-44" width="20" height="30" rx="5" fill="${mc}"/><text x="0" y="-24" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">10</text><rect x="-8" y="-14" width="6" height="14" fill="#222"/><g id="kl" transform="rotate(0 5 -14)"><rect x="2" y="-14" width="7" height="16" fill="#222"/><rect x="1" y="1" width="11" height="4" rx="2" fill="#eee"/></g></g><circle id="bl" cx="150" cy="188" r="7" fill="#fff" stroke="#222" stroke-width="2"/></svg>`;
}
function freeKick(min){
 const lv=Math.min(G.r,3),pl=VQ.filter(v=>v[2]==lv),v=pl[Math.floor(R()*pl.length)],tot=[8,8,6,5][lv];
 const cob=S.sq.ATA?P.ATA[S.sq.ATA-1][0]:"Camisa 10";
 $("box").innerHTML=`<span class="tag" style="background:#e67e22">🎯 FALTA PERIGOSA</span> <span class="tag" style="background:var(--mu)">Verdadeiro ou falso · ${tot}s</span>${scene(cob)}<p class="mu" style="margin:4px 0">${cob} ajeita a bola... acerte a pergunta e ele converte!</p><div class="q">${v[0]}</div><div class="bar"><i id="tb"></i></div><div class="opts" style="grid-template-columns:1fr 1fr;margin-top:10px"><button data-v="1">✅ Verdadeiro</button><button data-v="0">❌ Falso</button></div>`;
 let t=tot,done=false;
 const bs=[...$("box").querySelectorAll("button")];
 const fin=(ans,btn)=>{if(done)return;done=true;clearInterval(tm);
  const ok=ans===v[1];
  bs.forEach(b=>{b.disabled=true;if((b.dataset.v=="1")===v[1])b.classList.add("ok")});
  if(btn&&!ok)btn.classList.add("no");
  S.rk.ans++;if(ok)reward(lv);else M.streak=0;
  shoot(ok,min)};
 bs.forEach(b=>b.onclick=()=>fin(b.dataset.v=="1",b));
 tm=setInterval(()=>{t-=.1;$("tb").style.width=(t/tot*100)+"%";if(t<=0)fin(null)},100);
}
function shoot(ok,min){
 const bl=$("bl"),kl=$("kl"),kk=$("kick"),gk=$("gk"),m=M,A=[145,188];
 const pos=(x,y)=>{bl.setAttribute("cx",x);bl.setAttribute("cy",y)};
 const fly=(a,c,b,ms,cb)=>{const t0=performance.now();(function f(n){const u=Math.min(1,(n-t0)/ms),w=1-u;pos(w*w*a[0]+2*w*u*c[0]+u*u*b[0],w*w*a[1]+2*w*u*c[1]+u*u*b[1]);if(u<1)requestAnimationFrame(f);else if(cb)cb()})(t0)};
 const out=ok?"gol":["barreira","trave","defesa","fora"][Math.floor(R()*4)];
 const end=()=>setTimeout(()=>{
  if(ok){m.a++;say(`${min}' ⚽ GOLAÇO de falta do ${T[G.me][0]}!`)}
  else say(`${min}' ${out=="barreira"?"A bola bateu na barreira.":out=="trave"?"Na trave! Que azar!":out=="defesa"?"O goleiro fez uma grande defesa.":"A bola passou por cima do gol."}`);
  draw2()},1000);
 kl.setAttribute("transform","rotate(55 5 -14)");
 setTimeout(()=>{
  kk.setAttribute("transform","translate(132,190)");kl.setAttribute("transform","rotate(-70 5 -14)");
  if(out=="gol"){gk.setAttribute("transform","translate(590,185) rotate(50)");fly(A,[360,10],[575,105],900,end)}
  else if(out=="defesa"){gk.setAttribute("transform","translate(548,172) rotate(-60)");fly(A,[360,30],[552,128],900,end)}
  else if(out=="trave")fly(A,[360,5],[520,80],850,()=>fly([520,80],[500,110],[465,170],350,end));
  else if(out=="fora")fly(A,[360,-10],[600,40],900,end);
  else fly(A,[240,170],[333,150],450,()=>fly([333,150],[300,110],[250,192],450,end));
 },500);
}
function draw2(){
 const m=M,l=m.log;draw();m.log=l;$("log").innerHTML=l.join("<br>");$("min").textContent=m.cur+"'";
 $("box").innerHTML=`<p class="mu">Bola rolando...</p>`;setTimeout(moment,700);
}
function endReg(){
 $("min").textContent="90'";
 if(M.a!=M.b)return finish(M.a>M.b);
 say("Empate! Vamos para os pênaltis.");
 M.pa=0;M.pb=0;M.pn=0;M.pl=[];
 setTimeout(penalty,900);
}
function penalty(){
 const m=M;
 if(m.pn>=5&&m.pa!=m.pb)return finish(m.pa>m.pb);
 $("min").textContent=`Pênaltis ${m.pa} x ${m.pb}`;
 ask(`🎯 PÊNALTI ${m.pn+1}: acerte para converter`,"#8e44ad",ok=>{
  const mine=R()<(ok?.88:.25),his=R()<.72;
  if(mine)m.pa++;if(his)m.pb++;
  say(`Pênalti ${m.pn+1}: você ${mine?"converteu ✅":"perdeu ❌"} · ${T[m.opp][0]} ${his?"converteu ✅":"perdeu ❌"}`);
  m.pn++;
  if(m.pn==5&&m.pa==m.pb)say("Segue empatado! Pênaltis alternados.");
  $("min").textContent=`Pênaltis ${m.pa} x ${m.pb}`;
  $("box").innerHTML="";setTimeout(penalty,800);
 });
}
function finish(won){
 const m=M;
 let bonus=0;if(won){bonus=40+20*G.r;if(G.r==3)bonus+=200;if(m.b==0)bonus+=30}
 S.tokens+=bonus;G.earn+=bonus;
 const k=S.rk,t0=tier(k.pts);let rp=0;k.played++;
 if(won){k.wins++;rp=20+10*G.r;if(G.r==3){rp+=100;k.titles++}}else rp=5*(G.r+1);
 k.pts+=rp;G.pts=(G.pts||0)+rp;
 if(!won||G.r==3){k.hist.push({t:G.me,f:won?"Campeão":RN[G.r],p:G.pts,d:new Date().toLocaleDateString("pt-BR")});k.hist.sort((a,b)=>b.p-a.p);k.hist=k.hist.slice(0,5)}
 const t1=tier(k.pts);sv();
 const sc=m.pn?`${m.a} x ${m.b} (pên. ${m.pa} x ${m.pb})`:`${m.a} x ${m.b}`;
 const winners=G.pairs.map(p=>p.includes(G.me)?(won?G.me:m.opp):(R()<.5?p[0]:p[1]));
 G.res[G.r]=winners;
 const last=G.r==3;
 let h=`<h1>${won?"🏆 Vitória!":"Eliminado"}</h1><div class="card"><p>${T[G.me][0]} ${sc} ${T[m.opp][0]}</p><p class="mu">🪙 +${G.earn} tokens nesta fase (bônus de resultado: +${bonus}) · Saldo: ${S.tokens}</p><p class="mu">⭐ Rank: ${k.pts} pts (+${rp} pelo resultado) · ${t1.n}${t1.i>t0.i?" · 🎉 Você subiu para "+t1.n+"!":""}</p>`;
 if(!won)h+=`<p>Seu time caiu nas ${RN[G.r].toLowerCase()}. Campeão desta edição: ${T[simulate(winners)][0]}.</p><button class="pri" onclick="showTree()">Ver chaveamento completo</button> <button onclick="menu()">Jogar de novo</button>`;
 else if(last)h+=`<p style="font-size:1.3rem">🏆 ${T[G.me][0]} é o campeão da Copa do Brasil!</p><button class="pri" onclick="showTree()">Ver chaveamento completo</button> <button onclick="menu()">Jogar de novo</button>`;
 else h+=`<p>${T[G.me][0]} avança para a próxima fase.</p><button class="pri" onclick="nextR()">Ver chaveamento</button>`;
 app.innerHTML=h+"</div>";
 G.w=winners;
}
function simulate(w){
 let cur=w;
 for(let r=G.r+1;r<4;r++){const n=[];for(let i=0;i<cur.length;i+=2)n.push(R()<.5?cur[i]:cur[i+1]);G.rounds[r]=cur;G.res[r-1]=G.res[r-1]||cur;cur=n}
 G.res[3]=[cur[0]];return cur[0];
}
function nextR(){G.rounds[G.r+1]=G.w;G.r++;bracket()}
menu();
</script>
